<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Accede a la plataforma HUB-WARDER." />
    <title>Iniciar sesión | HUB-WARDER</title>
  </head>
  <body>
    <div data-header></div>
    <main class="inner-page">
      <section class="auth-layout">
        <form class="auth-card" data-demo-form>
          <p class="eyebrow">Plataforma HUB</p>
          <h1>Bienvenido de nuevo.</h1>
          <p>Ingresa para consultar tus operaciones, documentos y alertas.</p>
          <div class="field">
            <label for="email">Correo electrónico</label
            ><input id="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Contraseña</label
            ><input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn-primary" type="submit">Iniciar sesión</button>
          <p class="form-note" data-form-message></p>
          <p class="auth-card__switch">
            ¿Aún no tienes acceso? <a href="/registrarse/">Solicítalo aquí</a>
          </p>
        </form>
      </section>
    </main>
    <div data-footer></div>
    <script type="module" src="./iniciar-sesion.js"></script>
  </body>
</html>
